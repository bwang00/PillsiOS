name: Pills
options:
  bundleIdPrefix: xyz.blueping
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Pills/Info.plist

targets:
  Pills:
    type: application
    platform: iOS
    sources:
      - path: Pills
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.blueping.pills
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
    info:
      path: Pills/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: Pills
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "用于语音输入，将语音转换为文字发送给 AI 教练"
        NSSpeechRecognitionUsageDescription: "用于语音输入，将语音转换为文字发送给 AI 教练"
    entitlements:
      path: Pills/Pills.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
